openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: masar
    description: Masar platform endpoints (stages, specializations, study tips)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnthropicConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAnthropicMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /masar/stages:
    get:
      operationId: listStages
      tags: [masar]
      summary: List all educational stages supported by Hayyaf
      responses:
        "200":
          description: List of stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stage"
  /masar/specializations:
    get:
      operationId: listSpecializations
      tags: [masar]
      summary: List Saudi university specializations
      responses:
        "200":
          description: List of specializations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialization"
  /masar/study-tips:
    get:
      operationId: listStudyTips
      tags: [masar]
      summary: Curated creative study tips
      responses:
        "200":
          description: List of study tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyTip"
  /masar/university-programs:
    get:
      operationId: listUniversityPrograms
      tags: [masar]
      summary: List university programs with admission rates and careers
      responses:
        "200":
          description: List of university programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniversityProgram"
  /masar/dashboard-summary:
    get:
      operationId: getDashboardSummary
      tags: [masar]
      summary: Aggregate counts for the home dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateAnthropicConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendAnthropicMessageBody:
      type: object
      properties:
        content:
          type: string
        stage:
          type: string
        learningStyle:
          type: string
          description: visual | auditory | kinesthetic
        images:
          type: array
          description: Base64 data URLs for image attachments analyzed by Hayyaf vision.
          items:
            type: string
      required:
        - content
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Stage:
      type: object
      properties:
        id:
          type: string
        nameAr:
          type: string
        descriptionAr:
          type: string
        icon:
          type: string
      required:
        - id
        - nameAr
        - descriptionAr
        - icon
    Specialization:
      type: object
      properties:
        id:
          type: integer
        nameAr:
          type: string
        category:
          type: string
        descriptionAr:
          type: string
        topUniversitiesAr:
          type: array
          items:
            type: string
        careerPathsAr:
          type: array
          items:
            type: string
        demandLevel:
          type: string
          enum: [low, medium, high, very_high]
      required:
        - id
        - nameAr
        - category
        - descriptionAr
        - topUniversitiesAr
        - careerPathsAr
        - demandLevel
    StudyTip:
      type: object
      properties:
        id:
          type: integer
        titleAr:
          type: string
        bodyAr:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
      required:
        - id
        - titleAr
        - bodyAr
        - category
        - durationMinutes
    UniversityProgram:
      type: object
      properties:
        id:
          type: integer
        universityAr:
          type: string
        universityShort:
          type: string
        programAr:
          type: string
        category:
          type: string
        admissionRate:
          type: integer
        careersAr:
          type: array
          items:
            type: string
        certificationsAr:
          type: array
          items:
            type: string
      required:
        - id
        - universityAr
        - universityShort
        - programAr
        - category
        - admissionRate
        - careersAr
        - certificationsAr
    DashboardSummary:
      type: object
      properties:
        totalStages:
          type: integer
        totalSpecializations:
          type: integer
        totalStudyTips:
          type: integer
        totalConversations:
          type: integer
        specializationsByCategory:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
            required:
              - category
              - count
      required:
        - totalStages
        - totalSpecializations
        - totalStudyTips
        - totalConversations
        - specializationsByCategory
